<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2Ray Console — 服务端</title>
  <link rel="icon" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // 主题提前应用，避免闪烁
    (function() {
      var t = localStorage.getItem('v2ray-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="brand">
      <div class="brand-mark">V</div>
      <span class="brand-name">V2Ray <span>Console</span></span>
    </div>
    <div class="header-divider"></div>
    <div class="header-status" id="headerStatus">
      <span class="dot"></span>
      <span id="headerStatusText">检查中</span>
    </div>
  </div>
  <div class="header-right">
    <a class="icon-btn" href="README.html" target="_blank" rel="noopener" title="查看帮助文档" aria-label="查看帮助文档">?</a>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题" aria-label="切换主题">🌙</button>
    <button class="icon-btn" onclick="refreshConfig()" title="刷新配置" aria-label="刷新配置">↻</button>
  </div>
</header>

<div class="container">

  <!-- Status Hero -->
  <section class="status-bar status-hero" id="statusHero">
    <div class="status-hero-main">
      <div class="status-orb"><span class="orb-dot"></span></div>
      <div class="status-text-block">
        <div class="status-label">运行状态</div>
        <div class="status-value" id="statusText">检查中…</div>
        <div class="status-meta">
          <span>版本 <strong id="versionText">—</strong></span>
          <span class="meta-sep">·</span>
          <span id="uptimeWrap" style="display:none">运行时长 <strong id="uptimeText">—</strong></span>
          <span id="latencyWrap" style="display:none">响应 <strong id="latencyText">—</strong></span>
        </div>
      </div>
    </div>
    <div class="status-controls">
      <button class="btn btn-success btn-sm" id="btnStart" onclick="doStart()">▶ 启动</button>
      <button class="btn btn-danger btn-sm" id="btnStop" onclick="doStop()">■ 停止</button>
      <button class="btn btn-warning btn-sm" id="btnRestart" onclick="doRestart()">↻ 重启</button>
    </div>
  </section>

  <!-- Overview -->
  <section class="overview" id="overview">
    <div class="overview-cell">
      <div class="overview-cell-top"><span class="overview-cell-icon">🛰️</span><span class="overview-cell-label">服务入站</span></div>
      <div class="overview-cell-value" id="ovServerInbounds">0</div>
      <div class="overview-cell-detail" id="ovServerInboundsDetail">—</div>
    </div>
    <div class="overview-cell">
      <div class="overview-cell-top"><span class="overview-cell-icon">👥</span><span class="overview-cell-label">用户总数</span></div>
      <div class="overview-cell-value" id="ovUsers">0</div>
      <div class="overview-cell-detail" id="ovUsersDetail">—</div>
    </div>
    <div class="overview-cell">
      <div class="overview-cell-top"><span class="overview-cell-icon">📤</span><span class="overview-cell-label">出站</span></div>
      <div class="overview-cell-value" id="ovOutbounds">0</div>
      <div class="overview-cell-detail" id="ovOutboundsDetail">—</div>
    </div>
    <div class="overview-cell">
      <div class="overview-cell-top"><span class="overview-cell-icon">🔀</span><span class="overview-cell-label">路由规则</span></div>
      <div class="overview-cell-value" id="ovRules">0</div>
      <div class="overview-cell-detail" id="ovRulesDetail">—</div>
    </div>
  </section>

  <!-- 服务入站管理 -->
  <div class="card">

    <div class="card-header">
      <h2>服务入站 <span class="count" id="configCharCount">0 字符</span></h2>
      <div class="card-header-tools">
        <div class="tabs">
          <button class="tab-btn active" id="tabFormBtn" onclick="switchTab('form')">表单</button>
          <button class="tab-btn" id="tabJsonBtn" onclick="switchTab('json')">JSON</button>
        </div>
      </div>
      <div class="card-header-tools">
        <button class="btn btn-primary btn-sm" id="saveBtn" onclick="saveConfig()">
          <span class="btn-spinner" aria-hidden="true"></span><span class="save-icon" aria-hidden="true">💾</span><span>保存</span> <span class="kbd">⌘S</span>
        </button>
      </div>
    </div>
    <div class="card-body">
      <div id="formPanel">
        <div class="empty-state" id="emptyState">
          <div class="icon">🛰️</div>
          <h3>暂无服务入站</h3>
          <p>服务端入站需满足两条：协议为 VMess / VLESS / Trojan / Shadowsocks，且监听地址非 <code>127.0.0.1</code> / <code>localhost</code>。当前配置里没有匹配项，请选择下方模板开始。</p>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="loadTemplate('vmess-server')">VMess 服务端</button>
            <button class="btn btn-outline btn-sm" onclick="loadTemplate('vless-reality-server')">VLESS + Reality</button>
            <button class="btn btn-outline btn-sm" onclick="loadTemplate('trojan-server')">Trojan 服务端</button>
            <button class="btn btn-outline btn-sm" onclick="loadTemplate('shadowsocks-server')">Shadowsocks 服务端</button>
          </div>
        </div>
        <div id="configForm" style="display:none"></div>
      </div>
      <div id="jsonPanel" style="display:none">
        <div class="json-editor-wrap">
          <div class="json-gutter" id="jsonGutter">1</div>
          <textarea id="configEditor" placeholder="完整 V2Ray 配置 JSON（保存时整段回写引擎）..." spellcheck="false" wrap="off"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Template -->
  <div class="card">
    <div class="card-header">
      <h2>快速模板</h2>
      <span class="hint">选择一个模板快速生成服务端配置，再修改端口 / 用户 / 私钥等</span>
    </div>
    <div class="card-body">
      <div class="templates-grid">
        <button class="template-card" onclick="loadTemplate('vmess-server')">
          <div class="template-icon violet">🚀</div>
          <div class="template-body">
            <div class="template-title">VMess 服务端</div>
            <div class="template-desc">传统方案，UUID + alterId；建议同时配 TLS</div>
          </div>
        </button>
        <button class="template-card" onclick="loadTemplate('vless-reality-server')">
          <div class="template-icon pink">🔒</div>
          <div class="template-body">
            <div class="template-title">VLESS + Reality</div>
            <div class="template-desc">现代推荐，无需证书；私钥需用 xray x25519 生成</div>
          </div>
        </button>
        <button class="template-card" onclick="loadTemplate('trojan-server')">
          <div class="template-icon amber">🛡️</div>
          <div class="template-body">
            <div class="template-title">Trojan 服务端</div>
            <div class="template-desc">TLS 友好的密码认证；生产环境需自配证书</div>
          </div>
        </button>
        <button class="template-card" onclick="loadTemplate('shadowsocks-server')">
          <div class="template-icon green">⚡</div>
          <div class="template-body">
            <div class="template-title">Shadowsocks 服务端</div>
            <div class="template-desc">轻量协议，AES-256-GCM；适合弱网环境</div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="server.js?v=1"></script>
</body>
</html>
